name: Validate and publish rankings
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Protect existing release files
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only --diff-filter=MD "$PREVIOUS" HEAD -- data/rankings/)
          if [ -n "$changed" ]; then
            echo "Existing releases are immutable. Add a new release ID instead:"
            echo "$changed"
            exit 1
          fi
      - name: Validate and build
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
